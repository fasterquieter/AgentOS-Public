[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentos-project-memory"
version = "0.1.0"
description = "Project memory and explainable context routing for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AgentOS contributors" }]
keywords = ["ai-agents", "context-engineering", "agents-md", "adr", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/fasterquieter/AgentOS-Public"
Repository = "https://github.com/fasterquieter/AgentOS-Public"

[project.scripts]
agentos = "agentos.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentos"]

[tool.hatch.build.targets.sdist]
include = [
  "src/agentos",
  "tests",
  "docs",
  "reviews",
  "examples",
  "seed",
  "ADAPTATION.md",
  "CAPABILITIES.md",
  "README.md",
  "LICENSE",
]
