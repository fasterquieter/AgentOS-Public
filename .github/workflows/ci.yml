name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .agentos-kit
      - run: python -m unittest discover -s .agentos-kit/tests -v
      - run: agentos validate
      - run: agentos validate --root .agentos-kit/examples/trailcache
      - run: agentos eval-routing --root .agentos-kit/examples/trailcache
